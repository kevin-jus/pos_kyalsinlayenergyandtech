name: Build Desktop and Mobile Applications

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        target: [windows, macos, linux, ios]
        include:
          - target: windows
            os: windows-latest
          - target: macos
            os: macos-latest
          - target: linux
            os: ubuntu-latest
          - target: ios
            os: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install project dependencies
        run: flutter pub get

      # ==================== COMPILATION STEPS ====================

      # 1. WINDOWS: Generate Self-Signed Cert, Build, and Package into .msix
      - name: Build and Package Windows (Self-Signed)
        if: matrix.target == 'windows'
        shell: powershell
        run: |
          # Step A: Compile release app
          flutter build windows --release

          # Step B: Create Self-Signed Certificate
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=MySelfSignedApp, O=MyCompany" -KeyUsage DigitalSignature -FriendlyName "Flutter App Dev Cert" -CertStoreLocation "Cert:\CurrentUser\My" -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")
          $password = ConvertTo-SecureString -String "SelfSigned123!" -Force -AsPlainText
          
          # Step C: Export certificate to .pfx file
          Export-PfxCertificate -Cert $cert -FilePath "build\windows\self_signed.pfx" -Password $password

          # Step D: Package MSIX using the self-signed certificate
          dart run msix:create --certificate-path "build\windows\self_signed.pfx" --certificate-password "SelfSigned123!" --publisher "CN=MySelfSignedApp, O=MyCompany"

      # 2. MACOS: Build raw app, install dmg packaging tool, and convert to .dmg
      - name: Build and Package macOS
        if: matrix.target == 'macos'
        run: |
          flutter build macos --release
          npm install -g create-dmg
          cd build/macos/Build/Products/Release/
          create-dmg *.app || true

      # 3. LINUX: Standard build (Outputs runnable binary folder)
      - name: Build Linux
        if: matrix.target == 'linux'
        run: flutter build linux --release

      # 4. IOS: Standard no-codesign build
      - name: Build iOS
        if: matrix.target == 'ios'
        run: flutter build ios --release --no-codesign

      # ==================== UPLOAD CUSTOMER FILES ====================

      - name: Upload Clean Installers & Apps
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-customer-installer
          path: |
            build/windows/x64/runner/Release/*.msix
            build/windows/self_signed.pfx
            build/macos/Build/Products/Release/*.dmg
            build/linux/x64/release/bundle/
            build/ios/iphoneos/