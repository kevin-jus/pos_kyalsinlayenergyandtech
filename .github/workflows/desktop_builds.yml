name: Build Desktop and Mobile Applications

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        target: [windows, macos, linux, ios]
        include:
          - target: windows
            os: windows-latest
          - target: macos
            os: macos-latest
          - target: linux
            os: ubuntu-latest
          - target: ios
            os: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install project dependencies
        run: flutter pub get

      # ==================== COMPILATION STEPS ====================

      # 1. WINDOWS: Build and automatically package into a single .msix installer
      - name: Build and Package Windows
        if: matrix.target == 'windows'
        run: |
          flutter build windows --release
          dart run msix:create --build-windows false --install-certificate false

      # 2. MACOS: Build raw app, install dmg packaging tool, and convert to .dmg
      - name: Build and Package macOS
        if: matrix.target == 'macos'
        run: |
          flutter build macos --release
          npm install -g create-dmg
          cd build/macos/Build/Products/Release/
          create-dmg *.app || true 
          # Note: '|| true' ensures it passes even if UI background styling warnings appear

      # 3. LINUX: Standard build (Outputs runnable binary folder)
      - name: Build Linux
        if: matrix.target == 'linux'
        run: flutter build linux --release

      # 4. IOS: Standard no-codesign build
      - name: Build iOS
        if: matrix.target == 'ios'
        run: flutter build ios --release --no-codesign

      # ==================== UPLOAD CUSTOMER FILES ====================

      - name: Upload Clean Installers & Apps
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-customer-installer
          path: |
            build/windows/x64/runner/Release/*.msix
            build/macos/Build/Products/Release/*.dmg
            build/linux/x64/release/bundle/
            build/ios/iphoneos/
