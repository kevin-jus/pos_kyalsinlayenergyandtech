name: Build Desktop and Mobile Applications

on:
  push:
    branches: [ main, master, test-branch ]
  pull_request:
    branches: [ main, master, test-branch ]

jobs:
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        target: [windows, macos, linux, ios, android]
        include:
          - target: windows
            os: windows-latest
          - target: macos
            os: macos-latest
          - target: linux
            os: ubuntu-latest
          - target: ios
            os: macos-latest
          - target: android
            os: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Java
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install project dependencies
        run: flutter pub get

      # ==================== COMPILATION STEPS ====================

      # 1. WINDOWS: Build, Generate Cert, and Package MSIX
      - name: Build and Package Windows (Self-Signed)
        if: matrix.target == 'windows'
        shell: powershell
        run: |
          flutter build windows --release
          dart pub global activate msix
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=LPG-POS-System, O=KyalSinLayEnergyAndTech" -KeyUsage DigitalSignature -FriendlyName "Flutter App Dev Cert" -CertStoreLocation "Cert:\CurrentUser\My" -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")
          $password = ConvertTo-SecureString -String "SelfSigned123!" -Force -AsPlainText
          New-Item -ItemType Directory -Force -Path "build\windows"
          Export-PfxCertificate -Cert $cert -FilePath "build\windows\self_signed.pfx" -Password $password
          dart run msix:create --certificate-path "build\windows\self_signed.pfx" --certificate-password "SelfSigned123!" --publisher "CN=LPG-POS-System, O=KyalSinLayEnergyAndTech" --install-certificate false

      # 2. MACOS: Build raw app and package into .dmg
      - name: Build and Package macOS
        if: matrix.target == 'macos'
        run: |
          flutter build macos --release
          npm install -g create-dmg
          APP_PATH=$(find build/macos/Build/Products/Release -name "*.app" -maxdepth 1)
          create-dmg "$APP_PATH" build/macos/Build/Products/Release/ || true

      # 3. LINUX: Standard release build
      - name: Build Linux
        if: matrix.target == 'linux'
        run: flutter build linux --release

      # 4. IOS: No-codesign runner build
      - name: Build iOS
        if: matrix.target == 'ios'
        run: flutter build ios --release --no-codesign

      # 5. ANDROID: Build release APK
      - name: Build Android
        if: matrix.target == 'android'
        run: flutter build apk --release

      # ==================== UPLOAD ARTIFACTS ====================

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-customer-installer
          path: |
            build/windows/x64/runner/Release/*.msix
            build/windows/self_signed.pfx
            build/macos/Build/Products/Release/*.dmg
            build/linux/x64/release/bundle/
            build/ios/iphoneos/
            build/app/outputs/flutter-apk/*.apk
          if-no-files-found: ignore